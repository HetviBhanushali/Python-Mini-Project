<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Finance Dashboard</title>
<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #2f4f4f;
  padding: 30px;
}

.dashboard {
  background: #f6f8f8;
  border-radius: 30px;
  padding: 30px;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-left {
  display: flex;
  gap: 15px;
  background: white;
  padding: 8px;
  border-radius: 40px;
}

.nav-left button {
  border: none;
  background: none;
  padding: 10px 16px;
  border-radius: 30px;
  cursor: pointer;
}

.nav-left .active {
  background: black;
  color: white;
}

.nav-right button {
  background: #003c3c;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
}

/* HEADER */
.header {
  margin-top: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  margin: 0;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1.2fr 1.5fr 1fr;
  gap: 20px;
  margin-top: 25px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
}

/* INCOME */
.income h2 {
  margin: 0;
}

.chart {
  height: 80px;
  background: linear-gradient(180deg,#e6ecec,#fff);
  border-radius: 12px;
  margin-top: 15px;
}

/* CIRCLE */
.circle {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 14px solid #d9e4e4;
  border-top-color: #0dbb78;
  border-right-color: #ffd166;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
}

.circle h1 {
  margin: 0;
}

/* EXPENSE */
.bar {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.bar div {
  width: 60px;
  border-radius: 10px;
}

.bar .b1 {height:120px;background:#003c3c;}
.bar .b2 {height:80px;background:#6a8f8f;}
.bar .b3 {height:60px;background:#cddada;}

/* CARD */
.credit-card {
  background: linear-gradient(135deg,#003c3c,#0a5c5c);
  color: white;
  border-radius: 20px;
  padding: 20px;
}

.credit-card h3 {
  margin: 0 0 20px 0;
}

.credit-card p {
  letter-spacing: 3px;
}

/* MONEY FLOW */
.flow {
  height: 90px;
  background: linear-gradient(180deg,#e6ecec,#fff);
  border-radius: 12px;
  margin-top: 10px;
}

/* TEXT MUTED */
.muted {
  color: #6b7c7c;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="dashboard">

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-left">
      <button>Home</button>
      <button class="active">Dashboard</button>
      <button>Your Accounts</button>
      <button>Transactions</button>
      <button>Support</button>
    </div>
    <div class="nav-right">
      <button>Your Profile</button>
    </div>
  </div>

  <!-- HEADER -->
  <div class="header">
    <h1>Good morning, James</h1>
    <input type="search" placeholder="Search..." style="padding:10px;border-radius:20px;border:none;">
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- LEFT -->
    <div>
      <div class="card income">
        <p class="muted">Income</p>
        <h2>$2,200</h2>
        <div class="chart"></div>
      </div>

      <div class="card" style="margin-top:20px;">
        <h3>Expense Strategy</h3>
        <h2>$25k</h2>
        <div class="bar">
          <div class="b1"></div>
          <div class="b2"></div>
          <div class="b3"></div>
        </div>
      </div>
    </div>

    <!-- CENTER -->
    <div>
      <div class="card">
        <h3>Overview</h3>
        <div class="circle">
          <h1>$4,682</h1>
        </div>
        <p class="muted" style="text-align:center;">Available Balance</p>
      </div>

      <div class="card" style="margin-top:20px;">
        <h3>Money Flow</h3>
        <h2>$4,430</h2>
        <div class="flow"></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <div class="card credit-card">
        <h3>VISA</h3>
        <p>**** **** **** 5491</p>
        <p class="muted">EXP 12/23/2030</p>
        <p>James Smith</p>
      </div>

      <div class="card" style="margin-top:20px;">
        <h3>Wealth Overview</h3>
        <p>Banking: <strong>$9,681.49</strong></p>
        <p>Checking: <strong>$7,583.00</strong></p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
