{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transactions</title>
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #0f766e;
  padding: 30px;
}

.dashboard {
  background: #f6f8f8;
  border-radius: 30px;
  padding: 30px;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-left {
  display: flex;
  gap: 15px;
  background: white;
  padding: 8px;
  border-radius: 40px;
}

.nav-left button {
  border: none;
  background: none;
  padding: 10px 16px;
  border-radius: 30px;
}

.nav-left .active {
  background: #0f766e;
  color: white;
}

.nav-right button {
  background: #0f766e;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
}

.table {
  margin-top: 30px;
  background: white;
  border-radius: 20px;
  padding: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 14px;
  text-align: left;
}

th {
  color: #0f766e;
}

tr:not(:last-child) {
  border-bottom: 1px solid #e0e0e0;
}

.amount {
  font-weight: bold;
}

.negative {
  color: #c0392b;
}

.positive {
  color: #0f766e;
}
</style>
</head>

<body>
<div class="dashboard">

  <div class="navbar">
    <div class="nav-left">
      <nav><a href="#home">Home</a></nav>
      <nav><a href="dashboard.html">Dashboard</a></nav>
      <nav><a href="accounts.html">Your Accounts</a></nav>
      <nav class="active"><a href="transactions.html">Transactions</a></nav>
      <nav><a href="support1.html">Support</a></nav>
    </div>
    <div class="nav-right">
      <nav>Profile</nav>
    </div>
  </div>

  <h1 style="margin-top:30px;">Recent Transactions</h1>

  <div class="table">
    <table>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Type</th>
        <th>Amount</th>
      </tr>
      <tr>
        <td>24 Jan</td>
        <td>Grocery Store</td>
        <td>Expense</td>
        <td class="amount negative">- $120</td>
      </tr>
      <tr>
        <td>22 Jan</td>
        <td>Salary</td>
        <td>Income</td>
        <td class="amount positive">+ $2,200</td>
      </tr>
      <tr>
        <td>20 Jan</td>
        <td>Electricity Bill</td>
        <td>Expense</td>
        <td class="amount negative">- $85</td>
      </tr>
    </table>
  </div>

</div>
</body>
</html>
