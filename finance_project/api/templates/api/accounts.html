{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Accounts</title>
<link rel="stylesheet" href="{% static 'css/styles.css' %}">

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #0f766e;
  padding: 30px;
}

.dashboard {
  background: #f6f8f8;
  border-radius: 30px;
  padding: 30px;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-left {
  display: flex;
  gap: 15px;
  background: white;
  padding: 8px;
  border-radius: 40px;
}

.nav-left button {
  border: none;
  background: none;
  padding: 10px 16px;
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.nav-left button a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
  transition: all 0.3s ease;
}

.nav-left button:hover {
  background: #f0f0f0;
}

.nav-left button:hover a {
  color: #000;
}

.nav-left .active {
  background: #0f766e;
  color: white;
}

.nav-left .active a {
  color: white;
}

.nav-right button {
  background: #0f766e;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

.nav-right button:hover {
  background: #0d6b63;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
}

.card h3 {
  margin-top: 0;
}

.balance {
  font-size: 26px;
  color: #0f766e;
}

.muted {
  color: #6b7c7c;
  font-size: 14px;
}
</style>
</head>

<body>
<div class="dashboard">

  <div class="navbar">
    <div class="nav-left">
      <nav><a href="#home">Home</a></nav>
      <nav><a href="dashboard.html">Dashboard</a></nav>
      <nav class="active"><a href="accounts.html">Your Accounts</a></nav>
      <nav><a href="transactions.html">Transactions</a></nav>
      <nav><a href="support1.html">Support</a></nav>
    </div>
    <div class="nav-right">
      <nav>Profile</nav>
    </div>
  </div>

  <h1 style="margin-top:30px;">Your Accounts</h1>

  <div class="grid">
    <div class="card">
      <h3>Savings Account</h3>
      <p class="balance">$9,681.49</p>
      <p class="muted">Interest: 4.5%</p>
    </div>

    <div class="card">
      <h3>Checking Account</h3>
      <p class="balance">$7,583.00</p>
      <p class="muted">Daily transactions</p>
    </div>

    <div class="card">
      <h3>Credit Account</h3>
      <p class="balance">$1,250 Used</p>
      <p class="muted">Limit: $5,000</p>
    </div>
  </div>

</div>
</body>
</html>
