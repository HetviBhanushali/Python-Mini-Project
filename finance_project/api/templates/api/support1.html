{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Support</title>
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #0f766e;
  padding: 30px;
}

.dashboard {
  background: #f6f8f8;
  border-radius: 30px;
  padding: 30px;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-left {
  display: flex;
  gap: 15px;
  background: white;
  padding: 8px;
  border-radius: 40px;
}

.nav-left button {
  border: none;
  background: none;
  padding: 10px 16px;
  border-radius: 30px;
}

.nav-left .active {
  background: #0f766e;
  color: white;
}

.nav-right button {
  background: #0f766e;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button.submit {
  margin-top: 15px;
  background: #0f766e;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="dashboard">

  <div class="navbar">
    <div class="nav-left">
      <nav><a href="#home">Home</a></nav>
      <nav><a href="dashboard.html">Dashboard</a></nav>
      <nav><a href="accounts.html">Your Accounts</a></nav>
      <nav><a href="transactions.html">Transactions</a></nav>
      <nav class="active"><a href="support1.html">Support</a></nav>
    </div>
    <div class="nav-right">
      <nav>Profile</nav>
    </div>
  </div>

  <h1 style="margin-top:30px;">Support</h1>

  <div class="card">
    <h3>Contact Us</h3>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea rows="4" placeholder="Describe your issue..."></textarea>
    <button class="submit">Submit</button>
  </div>

</div>
</body>
</html>
